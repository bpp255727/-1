<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบข้อมูลสำรวจเสาไฟ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    /* ตั้งค่าโครงสร้างพื้นฐาน */
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f5f7fb; }
    .toolbar { background: #2563eb; color: white; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .toolbar h1 { margin: 0; font-size: 18px; }
    .content { display: flex; flex: 1; min-height: 0; }
    #map { flex: 1; }
    
    /* สไตล์ของ Popup แผนที่ */
    .popup-container { width: 280px; font-size: 14px; line-height: 1.5; }
    .popup-img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; cursor: pointer; border: 1px solid #ccc; }
    .popup-row { margin-bottom: 6px; }
    .popup-actions { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
    .popup-select { flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .popup-btn { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .popup-btn:hover { background: #15803d; }
    
    /* สไตล์ไอคอนหมุด + ลูกศรทิศทาง */
    .directional-marker { position: relative; width: 36px; height: 36px; }
    .marker-dot { width: 14px; height: 14px; background: #ef4444; border: 2px solid white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0,0,0,0.4); z-index: 2; }
    .marker-arrow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: transform 0.3s ease; }
    .marker-arrow::before { content: '▲'; font-size: 20px; color: #2563eb; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); text-shadow: 0 0 2px white; }
  </style>
</head>
<body>

  <div class="toolbar">
    <h1>ตรวจสอบข้อมูลสำรวจเสาไฟและอุปกรณ์</h1>
  </div>

  <div class="content">
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // URL ของ Google Apps Script (Web App) ที่ใช้ดึงข้อมูลและอัปเดตข้อมูล
    const GAS_API_URL = 'ใส่_URL_WEB_APP_ของคุณที่นี่'; 

    // 1. ตั้งค่าแผนที่และ Base Layer (Radio Button)
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

    const map = L.map('map', {
      center: [13.736717, 100.523186],
      zoom: 10,
      layers: [streetLayer] // ค่าเริ่มต้น
    });

    const baseMaps = {
      "แผนที่ถนน (Street)": streetLayer,
      "แผนที่ดาวเทียม (Satellite)": satelliteLayer
    };
    L.control.layers(baseMaps, null, { collapsed: false }).addTo(map);

    const mapLayerGroup = L.markerClusterGroup({ maxClusterRadius: 50 });
    mapLayerGroup.addTo(map);

    // 2. ดึงข้อมูลและสร้างหมุด
    async function loadData() {
      // หมายเหตุ: ในการใช้งานจริง ควร Fetch ข้อมูล JSON จาก GAS_API_URL
      // โค้ดส่วนนี้เป็นการจำลองข้อมูล (Mock Data) ตามโครงสร้าง Schema ที่ออกแบบไว้
      const mockData = [
        {
          "row.id": "req-001",
          "image_url": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Utility_pole_in_Thailand.jpg/400px-Utility_pole_in_Thailand.jpg",
          "pole_id": "PEA-1234",
          "latitude": 13.8027,
          "longitude": 100.3989,
          "direction": "180° S",
          "image_timestamp": "12/09/2026 11:34",
          "status": "รอตรวจสอบ",
          "line_display_name": "ภณภณ"
        }
      ];
      renderMarkers(mockData);
    }

    // 3. แปลงทิศทางเป็นองศาสำหรับหมุนลูกศร
    function extractRotation(directionStr) {
      const match = String(directionStr).match(/(\d+)/);
      return match ? parseInt(match[1], 10) : 0;
    }

    // 4. สร้างหมุดและ Popup
    function renderMarkers(data) {
      mapLayerGroup.clearLayers();

      data.forEach(row => {
        if (!row.latitude || !row.longitude) return;

        const rotation = extractRotation(row.direction);
        const iconHtml = `
          <div class="directional-marker">
            <div class="marker-arrow" style="transform: rotate(${rotation}deg);"></div>
            <div class="marker-dot" style="background: ${row.status === 'ตรวจสอบแล้ว' ? '#16a34a' : '#ef4444'}"></div>
          </div>
        `;

        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });
        const marker = L.marker([row.latitude, row.longitude], { icon: customIcon });

        const popupContent = `
          <div class="popup-container">
            <a href="${row.image_url}" target="_blank">
              <img src="${row.image_url}" class="popup-img" alt="ภาพเสาไฟ" title="คลิกเพื่อดูภาพขนาดเต็ม">
            </a>
            <div class="popup-row"><strong>รหัสเสา:</strong> ${row.pole_id || '-'}</div>
            <div class="popup-row"><strong>เวลาถ่าย:</strong> ${row.image_timestamp}</div>
            <div class="popup-row"><strong>ผู้สำรวจ:</strong> ${row.line_display_name}</div>
            <div class="popup-row"><strong>ทิศทาง:</strong> ${row.direction}</div>
            
            <div class="popup-actions">
              <select id="status-${row['row.id']}" class="popup-select">
                <option value="รอตรวจสอบ" ${row.status === 'รอตรวจสอบ' ? 'selected' : ''}>รอตรวจสอบ</option>
                <option value="ตรวจสอบแล้ว" ${row.status === 'ตรวจสอบแล้ว' ? 'selected' : ''}>ตรวจสอบแล้ว</option>
                <option value="ข้อมูลผิดพลาด" ${row.status === 'ข้อมูลผิดพลาด' ? 'selected' : ''}>ข้อมูลผิดพลาด</option>
              </select>
              <button class="popup-btn" onclick="updateStatus('${row['row.id']}')">บันทึก</button>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent).addTo(mapLayerGroup);
      });
      
      if(data.length > 0) {
          const group = new L.featureGroup(mapLayerGroup.getLayers());
          map.fitBounds(group.getBounds(), { padding: [30, 30] });
      }
    }

    // 5. อัปเดตสถานะ (ยึดตาม row.id)
    window.updateStatus = async function(rowId) {
      const selectElement = document.getElementById(`status-${rowId}`);
      const newStatus = selectElement.value;
      const btn = selectElement.nextElementSibling;
      
      btn.innerText = 'กำลังบันทึก...';
      btn.disabled = true;

      try {
        // ส่งคำสั่งไปยัง Google Apps Script (doPost) พร้อมระบุ row.id
        /*
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', rowId: rowId, status: newStatus })
        });
        const result = await response.json();
        */
        
        // จำลองความสำเร็จ
        setTimeout(() => {
          alert('อัปเดตสถานะเรียบร้อยแล้ว');
          btn.innerText = 'บันทึก';
          btn.disabled = false;
        }, 800);

      } catch (error) {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
        btn.innerText = 'บันทึก';
        btn.disabled = false;
      }
    };

    loadData();
  </script>
</body>
</html>

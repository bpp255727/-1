<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบเสาไฟ (Admin Dashboard)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    /* ========================================== */
    /* 1. Base Styles & Layout */
    /* ========================================== */
    html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f5f7fb; display: flex; flex-direction: column; }
    .toolbar { padding: 12px 16px; background: #2563eb; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
    .toolbar h1 { margin: 0; font-size: 18px; }
    .content { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; min-height: 360px; }
    
    /* ========================================== */
    /* 2. Side Panel */
    /* ========================================== */
    .info-panel { width: 320px; background: #ffffff; border-left: 1px solid #e5e7eb; padding: 16px; display: flex; flex-direction: column; box-sizing: border-box; }
    .card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 14px; }
    .card strong { display: block; margin-bottom: 8px; color: #1d4ed8; }
    .items-container { flex: 1; overflow-y: auto; }
    .summary-item { margin-bottom: 8px; padding: 10px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; transition: background 0.2s ease; }
    .summary-item:hover { background: #eef2ff; border-color: #c7d2fe; }
    .summary-item .title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .summary-item .desc { font-size: 12px; color: #64748b; }

    /* ========================================== */
    /* 3. Map Marker & Arrow */
    /* ========================================== */
    .directional-marker { position: relative; width: 36px; height: 36px; }
    .marker-dot { width: 14px; height: 14px; background: #ef4444; border: 2px solid white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0,0,0,0.4); z-index: 2; }
    .marker-arrow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: transform 0.3s ease; }
    .marker-arrow::before { content: '▲'; font-size: 20px; color: #2563eb; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); text-shadow: 0 0 2px white; }
    
    /* ========================================== */
    /* 4. Popup Content */
    /* ========================================== */
    .popup-container { width: 280px; font-size: 13px; line-height: 1.5; color: #1f2937; }
    /* สไตล์ของภาพตัวอย่างให้ดูสวยงาม */
    .popup-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; border: 1px solid #e5e7eb; cursor: pointer; transition: opacity 0.2s; }
    .popup-img:hover { opacity: 0.85; }
    .popup-row { margin-bottom: 4px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
    .popup-actions { margin-top: 12px; display: flex; gap: 8px; }
    .popup-select { flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
    .popup-btn { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .popup-btn:hover { background: #15803d; }
    .popup-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    @media (max-width: 768px) {
      .content { flex-direction: column; }
      .info-panel { width: 100%; height: 300px; border-left: none; border-top: 1px solid #e5e7eb; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <h1>ระบบตรวจสอบงานสำรวจเสาไฟ 2569</h1>
  </div>

  <div class="content">
    <!-- แผนที่ -->
    <div id="map"></div>

    <!-- แผงข้อมูลด้านข้าง -->
    <div class="info-panel">
      <div class="card">
        <strong>สถานะข้อมูล</strong>
        <div id="statusCount">กำลังโหลดข้อมูล...</div>
      </div>
      
      <div class="card" style="flex: 1; display: flex; flex-direction: column; padding-bottom: 0;">
        <strong>รายการที่ส่งมา</strong>
        <div id="itemsContainer" class="items-container">
          <!-- รายการจะถูกแทรกที่นี่ -->
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    // URL ของ Google Sheet
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQL0YNuJSi1J64Q8_upur96DOxELqmUlOKIM3CJxry4uuROuZz5sN08kaS-XJr7xphKJdMzZ1g64KRq/pub?output=csv&gid=0';
    
    // URL ของ Google Apps Script สำหรับรับค่าการอัปเดต (ตั้งค่าในภายหลัง)
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzgvkdpjOHbbrDhdLZUmeOnM4iwpxR-v6B---6GwCM1O3l8uGn_o-dJ43j1WEVmI4cLvg/exec';

    let allData = [];
    let headers = [];
    let mapLayerGroup;

    // 1. ตั้งค่าแผนที่
    const map = L.map('map').setView([13.7367, 100.5231], 10);
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

    L.control.layers({
      "แผนที่ถนน (Street)": streetLayer,
      "แผนที่ดาวเทียม (Satellite)": satelliteLayer
    }, null, { collapsed: false }).addTo(map);

    mapLayerGroup = L.featureGroup().addTo(map);

    // 2. ดึงข้อมูลจาก Sheet
    async function loadData() {
      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        const rows = readCsvText(text);
        
        if (rows.length < 2) {
          document.getElementById('statusCount').innerText = 'ไม่พบข้อมูลใน Sheet';
          return;
        }

        headers = rows[0].map(h => h.trim().toLowerCase());
        
        allData = rows.slice(1).map(row => {
          let obj = {};
          headers.forEach((header, index) => {
            obj[header] = row[index] || '';
          });
          return obj;
        });

        renderMapAndList();

      } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById('statusCount').innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
      }
    }

    // ฟังก์ชันแปลงลิงก์ Google Drive ให้เป็นรูประบบ Thumbnail
    function getDriveThumbnailUrl(url) {
      if (!url) return '';
      // ค้นหา ID จาก URL ของ Google Drive
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        // ใช้ Endpoint ของ Google สำหรับดึงรูปตรงๆ (sz=w400 คือปรับความกว้าง 400px ให้เหมาะกับพรีวิว)
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
      }
      return url; // ถ้าไม่ใช่ลิงก์ Drive คืนค่าเดิม
    }

    // 3. ฟังก์ชันสร้างหมุดและรายการ
    function renderMapAndList() {
      mapLayerGroup.clearLayers();
      const itemsContainer = document.getElementById('itemsContainer');
      itemsContainer.innerHTML = '';
      let count = 0;

      allData.forEach((row, index) => {
        const lat = parseFloat(row['latitude']);
        const lon = parseFloat(row['longitude']);
        
        if (isNaN(lat) || isNaN(lon)) return;
        count++;

        const rowId = row['row.id'];
        const poleId = row['pole_id'] || '-';
        const direction = row['direction'] || '0';
        const status = row['status'] || 'รอ admin ตรวจสอบ';
        const imageUrl = row['image_url'] || '';
        const surveyor = row['line_display_name'] || 'ไม่ระบุ';
        const timestamp = row['image_timestamp'] || '-';

        // แปลงภาพ
        const thumbUrl = getDriveThumbnailUrl(imageUrl);

        const isVerified = status.includes('ตรวจสอบแล้ว');
        const markerColor = isVerified ? '#16a34a' : (status.includes('ผิดพลาด') ? '#d97706' : '#ef4444');
        const rotation = extractRotation(direction);

        const iconHtml = `
          <div class="directional-marker">
            <div class="marker-arrow" style="transform: rotate(${rotation}deg); color: ${isVerified ? '#16a34a' : '#2563eb'};"></div>
            <div class="marker-dot" style="background: ${markerColor}"></div>
          </div>
        `;
        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });
        const marker = L.marker([lat, lon], { icon: customIcon });

        // สร้าง HTML สำหรับ Popup (นำรูป Thumbnail มาแสดง และคลิกเพื่อเปิดรูปเต็ม)
        const popupContent = `
          <div class="popup-container">
            ${imageUrl ? `<a href="${imageUrl}" target="_blank" title="คลิกเพื่อดูภาพขนาดเต็ม"><img src="${thumbUrl}" class="popup-img" alt="ภาพหน้างาน"></a>` : ''}
            <div class="popup-row"><strong>รหัสเสา:</strong> ${escapeHtml(poleId)}</div>
            <div class="popup-row"><strong>ผู้สำรวจ:</strong> ${escapeHtml(surveyor)}</div>
            <div class="popup-row"><strong>เวลา:</strong> ${escapeHtml(timestamp)}</div>
            <div class="popup-row"><strong>ทิศทาง:</strong> ${escapeHtml(direction)}</div>
            
            <div class="popup-actions">
              <select id="status-${rowId}" class="popup-select">
                <option value="รอ admin ตรวจสอบ" ${status === 'รอ admin ตรวจสอบ' ? 'selected' : ''}>รอ admin ตรวจสอบ</option>
                <option value="ตรวจสอบแล้ว" ${status === 'ตรวจสอบแล้ว' ? 'selected' : ''}>ตรวจสอบแล้ว</option>
                <option value="ข้อมูลผิดพลาด" ${status === 'ข้อมูลผิดพลาด' ? 'selected' : ''}>ข้อมูลผิดพลาด</option>
              </select>
              <button class="popup-btn" onclick="updateStatus('${rowId}')">อัปเดต</button>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent).addTo(mapLayerGroup);

        const listItem = document.createElement('div');
        listItem.className = 'summary-item';
        listItem.style.borderLeft = `5px solid ${markerColor}`;
        listItem.innerHTML = `
          <div class="title">ผู้สำรวจ: ${escapeHtml(surveyor)}</div>
          <div class="desc">เวลา: ${escapeHtml(timestamp)}<br>สถานะ: <b>${escapeHtml(status)}</b></div>
        `;
        
        listItem.addEventListener('click', () => {
          map.setView(marker.getLatLng(), 18);
          marker.openPopup();
        });
        
        itemsContainer.appendChild(listItem);
      });

      document.getElementById('statusCount').innerText = `พบข้อมูลที่มีพิกัด: ${count} รายการ`;

      if (count > 0) {
        map.fitBounds(mapLayerGroup.getBounds(), { padding: [30, 30] });
      }
    }

// 4. ฟังก์ชันอัปเดตสถานะ (เชื่อมต่อ API จริง)
    window.updateStatus = async function(rowId) {
      const selectElement = document.getElementById(`status-${rowId}`);
      const newStatus = selectElement.value;
      const btn = selectElement.nextElementSibling;
      
      btn.innerText = 'รอ...';
      btn.disabled = true;

      try {
        const response = await fetch('ใส่_URL_WEB_APP_ที่ได้จาก_APPS_SCRIPT_ที่นี่', {
          method: 'POST',
          redirect: 'follow', // บังคับให้ตาม Redirect ของ Google ไป
          headers: {
            "Content-Type": "text/plain;charset=utf-8", // ต้องใช้ text/plain เพื่อหลบระบบป้องกัน CORS
          },
          body: JSON.stringify({ action: 'updateStatus', rowId: rowId, status: newStatus })
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert('อัปเดตสถานะเป็น: ' + newStatus);
          location.reload(); // รีเฟรชหน้าเพื่อโหลดข้อมูลและสีหมุดใหม่
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.error);
        }

      } catch (error) {
        console.error(error);
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย');
      } finally {
        btn.innerText = 'อัปเดต';
        btn.disabled = false;
      }
    };

    

    // 5. Utilities
    function extractRotation(directionStr) {
      const match = String(directionStr).match(/(\d+)/);
      return match ? parseInt(match[1], 10) : 0;
    }

    function escapeHtml(text) {
      return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // CSV Parser
    function readCsvText(text) {
      const rows = []; let row = []; let field = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (inQuotes && text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          row.push(field); field = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(field); if (row.some(value => value !== '')) rows.push(row);
          row = []; field = '';
        } else { field += ch; }
      }
      if (field.length > 0 || row.length > 0) { row.push(field); if (row.some(value => value !== '')) rows.push(row); }
      return rows;
    }

    // เริ่มทำงาน
    loadData();
  </script>
</body>
</html>
